<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>NUET.exe</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Bump ?v= on every release so Telegram doesn't keep serving old files. -->
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

  <!-- Line icons, reused with <svg><use href="#i-name"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
      <symbol id="i-math" viewBox="0 0 24 24"><path d="M7 4v6M4 7h6M14 7h6M4.5 14.5l5 5M9.5 14.5l-5 5M14 15.5h6M14 19h6"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.1 3.6-7 8-7s8 2.9 8 7"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/></symbol>
      <symbol id="i-quiz" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-forum" viewBox="0 0 24 24"><path d="M4 5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M16 9h4a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-1v3l-4-3h-3a1 1 0 0 1-1-1v-1"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></symbol>
      <symbol id="i-notebook" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18M12.5 8H16M12.5 12H16"/></symbol>
    </defs>
  </svg>

  <!-- Sign-up: one question per screen; edit mode shows every question on one page -->
  <section id="onboarding" hidden>
    <div class="wizard">
      <header class="wizard-top">
        <button class="icon-btn" id="wiz-back" aria-label="Back"><svg class="icon"><use href="#i-back"/></svg></button>
        <div class="progress"><div class="progress-fill" id="wiz-progress"></div></div>
        <span class="step-count" id="wiz-count"></span>
      </header>
      <div class="wizard-body" id="wizard-body"></div>
      <footer class="wizard-bottom">
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="primary" id="wiz-next">Continue</button>
        <button class="ghost" id="wiz-cancel" hidden>Cancel</button>
      </footer>
    </div>
  </section>

  <!-- Main app -->
  <div id="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Back" hidden><svg class="icon"><use href="#i-back"/></svg></button>
      <span class="logo"><span class="logo-mark">N</span><span class="logo-name">NUET<span class="logo-ext">.exe</span></span></span>
    </header>

    <main id="view"></main>

    <nav class="tabs">
      <button data-tab="home"><svg class="icon"><use href="#i-home"/></svg>Home</button>
      <button data-tab="math"><svg class="icon"><use href="#i-math"/></svg>Math</button>
      <button data-tab="ctps"><svg class="icon"><use href="#i-bulb"/></svg>CTPS</button>
      <button data-tab="forum"><svg class="icon"><use href="#i-forum"/></svg>Forum</button>
      <button data-tab="profile"><svg class="icon"><use href="#i-user"/></svg>Profile</button>
    </nav>
  </div>

  <!-- Log a mock test result -->
  <div class="modal" id="mock-modal" hidden>
    <form class="sheet" id="mock-form" novalidate>
      <h2>Add mock test result</h2>
      <label class="field">Test name <span class="hint">(optional)</span>
        <input id="mock-name" maxlength="40" placeholder="For example, NU official mock">
      </label>
      <label class="field">Date
        <input id="mock-date" type="date">
      </label>
      <div class="field-row">
        <label class="field">Math score
          <input id="mock-math" type="number" inputmode="numeric" min="0" max="200" placeholder="0">
        </label>
        <label class="field">CTPS score
          <input id="mock-ctps" type="number" inputmode="numeric" min="0" max="200" placeholder="0">
        </label>
      </div>
      <label class="field">Time used, in minutes <span class="hint">(optional)</span>
        <input id="mock-minutes" type="number" inputmode="numeric" min="1" max="300" placeholder="For example, 110">
      </label>
      <p class="hint small" id="mock-total">Total: –</p>
      <p class="form-error" id="mock-error" role="alert"></p>
      <button class="primary" type="submit">Save result</button>
      <button class="ghost" type="button" id="mock-cancel">Cancel</button>
    </form>
  </div>

  <!-- Full-screen image viewer: pinch or double-tap to zoom, drag to move -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer-stage" id="viewer-stage"><img id="viewer-img" alt="" draggable="false"></div>
    <button class="icon-btn viewer-close" id="viewer-close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
    <div class="viewer-tools">
      <button class="icon-btn" data-zoom-step="out" aria-label="Zoom out"><svg class="icon"><use href="#i-minus"/></svg></button>
      <button class="icon-btn reset" data-zoom-step="reset">Fit</button>
      <button class="icon-btn" data-zoom-step="in" aria-label="Zoom in"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>
    <p class="viewer-hint">Pinch, scroll or double-tap to zoom · drag to move</p>
  </div>

  <!-- Small forms (targets, notebook entries, forum posts) are built into this sheet by app.js -->
  <div class="modal" id="sheet-modal" hidden>
    <form class="sheet" id="sheet-form" novalidate></form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="forum-config.js?v=11"></script>
  <script src="tests.js?v=11"></script>
  <script src="content.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
